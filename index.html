<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151617">
    <meta
      name="description"
      content="Watch Sliroth live on Twitch every Tuesday, Wednesday, Friday, Saturday and Sunday at 7 PM UK time."
    >
    <title>Sliroth on Twitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@200;500&amp;display=swap"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="landing">
      <h1 class="channel-heading">
        <a
          class="channel-link"
          href="https://twitch.tv/sliroth"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="channel-platform">twitch.tv/</span><span class="channel-name">sliroth</span>
        </a>
      </h1>

      <section class="schedule" aria-labelledby="schedule-heading">
        <h2 id="schedule-heading">Live schedule</h2>
        <p>Tue <span aria-hidden="true">·</span> Wed <span aria-hidden="true">·</span> Fri <span aria-hidden="true">·</span> Sat <span aria-hidden="true">·</span> Sun <span class="schedule-time">at 7 PM UK time</span></p>
      </section>

      <nav class="social-links" aria-label="Social links">
        <ul>
          <li>
            <a
              class="social-link twitter-link"
              href="https://twitter.com/tomguthrie"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Tom Guthrie on Twitter"
            >
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M23.3 4.7c-.8.4-1.6.6-2.5.7.9-.5 1.6-1.4 1.9-2.4-.8.5-1.8.9-2.8 1.1a4.4 4.4 0 0 0-7.6 3c0 .4 0 .7.1 1C8.8 7.9 5.6 6.2 3.5 3.6a4.4 4.4 0 0 0 1.4 5.9c-.7 0-1.4-.2-2-.5 0 2.1 1.5 3.9 3.5 4.3-.4.1-.8.2-1.2.2-.3 0-.6 0-.8-.1a4.4 4.4 0 0 0 4.1 3.1A8.8 8.8 0 0 1 3 18.4c-.4 0-.7 0-1.1-.1a12.4 12.4 0 0 0 6.8 2c8.1 0 12.6-6.7 12.6-12.6v-.6c.8-.7 1.5-1.5 2-2.4Z"/>
              </svg>
              <span aria-hidden="true">tomguthrie</span>
            </a>
          </li>
          <li>
            <a
              class="social-link twitch-link"
              href="https://twitch.tv/sliroth"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Sliroth on Twitch"
            >
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.1 0 0 5.4v17.2h6V24l3.4-1.4h4.2L24 17.1V0H2.1Zm19.5 16-3.1 3.2h-4.8L11 21.9v-2.7H6.4V2.4h15.2V16Zm-3.1-9.2V13h-2.4V6.8h2.4Zm-6.6 0V13H9.5V6.8h2.4Z"/>
              </svg>
              <span aria-hidden="true">sliroth</span>
            </a>
          </li>
          <li>
            <a
              class="social-link youtube-link"
              href="https://youtube.com/@sliroth"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Sliroth on YouTube"
            >
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
              </svg>
              <span aria-hidden="true">@sliroth</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
